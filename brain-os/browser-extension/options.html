<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { max-width: 420px; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; }
    h1 { font-size: 16px; margin-bottom: 12px; }
    label { display: block; margin-top: 10px; font-weight: 500; }
    input { width: 100%; padding: 6px 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
    button { margin-top: 16px; padding: 8px 16px; background: #6366f1; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #4f46e5; }
    .hint { font-size: 12px; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>BrainOS extension settings</h1>
  <label>Backend API URL</label>
  <input id="apiBase" type="url" placeholder="https://your-brainos-backend.com">
  <div class="hint">e.g. http://localhost:8000 or your deployed backend</div>
  <label>API key (optional)</label>
  <input id="apiKey" type="password" placeholder="Leave empty if not required">
  <label>Tenant ID</label>
  <input id="tenantId" type="text" value="default" placeholder="default">
  <label>Namespace</label>
  <input id="namespace" type="text" value="main" placeholder="main">
  <button id="save">Save</button>
  <script src="options.js"></script>
</body>
</html>
