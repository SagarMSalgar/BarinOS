<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; padding: 12px; font-family: system-ui, sans-serif; font-size: 13px; margin: 0; }
    h2 { margin: 0 0 10px; font-size: 14px; }
    button { width: 100%; padding: 8px 12px; margin-bottom: 8px; cursor: pointer; background: #6366f1; color: #fff; border: none; border-radius: 6px; font-size: 13px; }
    button:hover { background: #4f46e5; }
    button.secondary { background: #e2e8f0; color: #334155; }
    button.secondary:hover { background: #cbd5e1; }
    a { color: #6366f1; text-decoration: none; }
    a:hover { text-decoration: underline; }
    p { margin: 8px 0; color: #64748b; font-size: 12px; }
    #status { font-size: 12px; margin-top: 8px; min-height: 18px; }
    .section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
    .section h3 { margin: 0 0 6px; font-size: 12px; color: #64748b; }
    #watched-list, #research-count { font-size: 11px; color: #64748b; max-height: 80px; overflow-y: auto; }
  </style>
</head>
<body>
  <h2>BrainOS</h2>
  <button id="add-page">Add this page to BrainOS</button>
  <p>Or select text and use the floating &quot;Ask BrainOS&quot; or right-click menu.</p>
  <div class="section">
    <h3>Research</h3>
    <button id="add-research" class="secondary">Add this page to research</button>
    <button id="synthesise">Synthesise research</button>
    <p id="research-count"></p>
  </div>
  <div class="section">
    <h3>Page watch</h3>
    <button id="check-watch" class="secondary">Check current page for changes</button>
    <div id="watched-list"></div>
  </div>
  <button id="open-options" class="secondary">Settings</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
